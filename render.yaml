services:
  - type: web
    name: tareas-semanales
    runtime: docker
    plan: free
    dockerfilePath: ./fetch/Dockerfile
    dockerContext: .
    envVars:
      - key: ZONA_HORARIA
        value: Europe/Madrid
      - key: DIA_REINICIO
        value: "6"
      # Se define en el panel de Render (no en el repo, que es público)
      - key: DATABASE_URL
        sync: false

databases:
  - name: tareas-db
    plan: free
