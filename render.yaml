services:
  - type: web
    name: tareas-semanales
    runtime: docker
    plan: free
    dockerfilePath: ./fetch/Dockerfile
    dockerContext: .
    envVars:
      - key: ZONA_HORARIA
        value: Europe/Madrid
      - key: DIA_REINICIO
        value: "6"
      - key: DATABASE_URL
        fromDatabase:
          name: tareas-db
          property: connectionString

databases:
  - name: tareas-db
    plan: free
