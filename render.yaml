services:
  - type: web
    name: tareas-semanales
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./fetch/Dockerfile
    dockerContext: .
    envVars:
      - key: ZONA_HORARIA
        value: Europe/Madrid
      - key: DIA_REINICIO
        value: "6"
      # Se define en el panel de Render (Neon, sin caducidad). No va en el repo porque es público.
      - key: DATABASE_URL
        sync: false
